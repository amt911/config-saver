name: CI

on:
  push:
    branches: [main]
    # This repo tags bare versions (3.1.1); a leading v is accepted too.
    tags: ['*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint · format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install '.[dev]'
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests · mypy (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum supported version and the current stable one.
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The encryption round-trip tests drive the real binaries; without them
      # those tests skip and the feature is untested.
      - run: sudo apt-get update && sudo apt-get install -y age gnupg
      - run: pip install '.[dev]'
      - run: mypy config_saver
      # The gate is the behavioural suite; ratchet --cov-fail-under as coverage grows.
      - run: pytest --cov=config_saver --cov-report=term-missing --cov-fail-under=90

  # Puerta de mutación — CLAUDE.md § "Mutation gate — el suelo del 60%". La cobertura
  # ya está gateada al 90% arriba, y aun así no puede ver un test sin asserts: esto sí.
  #
  # Solo en PRs contra main: mutmut reejecuta la suite una vez por mutante y es caro de
  # más para cada push de rama. Pagar eso en cada push es como se consigue que la gente
  # empuje con --no-verify.
  #
  # Nace ADVISORY (`continue-on-error`) porque el baseline real de este repo aún no se ha
  # medido. Se le quita cuando el score haya superado el umbral en dos runs seguidos, y se
  # anota aquí la fecha: si no, "advisory" es para siempre.
  mutation:
    name: Mutación (lógica pura, umbral 60%)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install '.[dev]'
      - name: Gate de mutación
        run: scripts/mutation-gate.sh
      - name: Resultados (también cuando falla — el porcentaje solo no es accionable)
        if: always()
        run: mutmut results || true

  packaging:
    name: Build · install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build
      - run: python -m build
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/cleanenv
          /tmp/cleanenv/bin/pip install dist/*.whl
          /tmp/cleanenv/bin/config-saver --version
          /tmp/cleanenv/bin/config-saver --help
          # The example configs must be reachable from a pip install, not only from the AUR package.
          test -f /tmp/cleanenv/share/config-saver/configs/default-config.yaml
      - name: Install the sdist into a clean environment
        run: |
          python -m venv /tmp/sdistenv
          /tmp/sdistenv/bin/pip install dist/*.tar.gz
          /tmp/sdistenv/bin/config-saver --version

  systemd:
    name: systemd units
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: systemd-analyze verify contrib/systemd/system/config-saver@.service contrib/systemd/system/config-saver@.timer
      - run: systemd-analyze verify contrib/systemd/user/config-saver.service contrib/systemd/user/config-saver.timer

  release-consistency:
    name: Tag matches pyproject version
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The 3.0.3-vs-3.1.1 drift shipped a --version that lied; make it a CI failure.
      # The tag is the bare version (3.2.0); a v prefix is tolerated and stripped.
      - run: |
          TAG="${GITHUB_REF_NAME#v}"
          PYPROJECT=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG pyproject=$PYPROJECT"
          test "$TAG" = "$PYPROJECT"

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install semgrep
      # Verified clean locally (0 findings) at the time this landed.
      - run: >-
          semgrep scan --error --disable-version-check --metrics=off
          --config p/python

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pip-audit
      - run: pip install .
      # Blocking: fix a finding by bumping the dependency, never by relaxing this.
      - run: pip-audit
