# Example configuration that requires root privileges
# This config is designed to backup system files that are owned by root
# Only root user can execute this configuration

# Set this to true to restrict execution to root user only
only_root_user: true

# Content normalization can still be enabled even for root-owned files
normalize_content: true

directories:
    # /etc/config-saver/configs is deliberately absent. It is the system policy
    # level, written by whoever administers the machine (a declarative installer
    # on this one), and --include-system-configs is the flag that archives it.
    # An example that lists it outright hands it back by the front door, and
    # examples are what people copy.

    # System connections (NetworkManager) - outside user home
    - /etc/NetworkManager/system-connections

    # libvirt/KVM: daemon configuration, virtual machine definitions, virtual
    # networks and nwfilters. The disk images under /var/lib/libvirt/images are
    # NOT here on purpose - they are data, not configuration, and huge.
    - /etc/libvirt

    # Locale and console keymap, the system half of the KDE locale/keyboard
    # settings (the user half is plasma-localerc / kxkbrc in default-config).
    - /etc/locale.conf
    - /etc/vconsole.conf

    # NFS server exports. Not present on this machine yet (nfs-utils is not
    # installed); uncomment once /etc/exports exists, or the run will report it
    # as a missing input on every pass.
    # - /etc/exports
    # - /etc/exports.d
    # - /etc/nfs.conf
