# Enable content normalization to replace hardcoded home paths in text files
# Set to true if you want config files (XML, JSON, etc.) to be portable across users
# Set to false (or omit) to only normalize file paths in the archive
normalize_content: true

# Optional: encrypt the resulting archive. gzip is compression, not
# confidentiality, so a configuration that backs up credentials should set this.
# Needs the `age` (or `gnupg`) binary. Restore with:
#   config-saver --decompress -i <archive>.tar.gz.age --identity ~/.config/age/key.txt
# encrypt:
#   method: age              # or gpg
#   recipients:
#     - age1qz...            # age public key, or a gpg key id / user id

directories:
    - source: "$CONFIG_DIR"
      files:
        - breezerc
        - dolphinrc
        - gtk-2.0
        - gtk-3.0
        - gtk-4.0
        - gtkrc
        - gtkrc-2.0
        - kate
        - Kvantum
        - katerc
        - konsolerc
        - kcminputrc
        - kdeglobals
        - kcmfonts
        - kglobalshortcutsrc
        - klipperrc
        - krunnerrc
        - kscreenlockerrc
        - ksmserverrc
        - kwinrc
        - kwinrulesrc
        - ksplashrc
        - khotkeysrc
        - klaunchrc
        - kfontinstuirc
        - latte
        - lattedockrc
        - lightlyrc
        - oxygenrc
        - plasma-org.kde.plasma.desktop-appletsrc
        - plasmarc
        - plasmashellrc
        - Trolltech.conf
        # Additional items from README/feature list (added if missing)
        - kactivitymanagerdrc
        - kactivitymanagerd-switcher
        - kactivitymanagerd-statsrc
        - kactivitymanagerd-pluginsrc
        - baloofilerc
        - kuriikwsfiltersrc
        - plasmanotifyrc
        - plasma-localerc
        - ktimezonedrc
        - kaccessrc
        - mimeapps.list
        - user-dirs.dirs
        - PlasmaUserFeedback
        - kxkbrc
        - touchpadxlibinputrc
        - kgammarc
        - powermanagementprofilesrc
        # Energy saving: the "do nothing" AC/battery profiles live here.
        - powerdevilrc
        - bluedevilglobalrc
        - kdeconnect
        - device_automounter_kcmrc
        - kded_device_automounterrc
        - arkrc
        - filelightrc
        - katevirc
        - kate-externaltoolspluginrc
        - kcalcrc
        - partitionmanagerrc
        - konsolesshconfig
        - krusaderrc
        - spectaclerc
        - systemmonitorrc
        - systemsettingsrc
        - kwinoutputconfig.json

    - source: "$SHARE_DIR"
      files:
        - plasma
        - kwin
        - konsole
        - fonts
        - color-schemes
        - aurorae
        - icons
        - wallpapers
        # Additional share items
        - kservices5/searchproviders
        - plasma-systemmonitor
        - user-places.xbel

    - source: "$LOCALSHARE_DIR"
      files:
        - kscreen
    - source: "$HOME"
      files:
        - .fonts
        - .themes
        - .icons

    # ⚠ SECRETS ⚠
    # config-saver archives are plain .tar.gz: compressed, NOT encrypted. Anything
    # listed below ends up readable by whoever can read the archive, so private
    # keys are deliberately NOT part of this default config.
    # To include a private key, add it explicitly (e.g. `- id_ed25519`) and keep the
    # resulting archive off cloud storage, backups and shared drives.
    - source: "$HOME/.ssh"
      files:
        - id_ed25519.pub
        - known_hosts
        - config

    # rclone.conf holds cloud tokens/credentials in clear text; same warning applies.
    - "$HOME/.config/rclone"
